<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AETHER — Pure Elegance</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&display=swap');

  :root {
    --bg: #03060a;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    cursor: none; /* Eigener Cursor */
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1500px; /* Tiefe für 3D */
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.08), transparent 40%),
      radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.08), transparent 40%);
    background-size: 200% 200%;
    animation: bgBreath 15s infinite alternate ease-in-out;
  }

  @keyframes bgBreath {
    0% { background-position: 0% 0%; }
    100% { background-position: 100% 100%; }
  }

  /* =========================================
     STERNENFELD (Canvas)
     ========================================= */
  #starfield {
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  /* =========================================
     GLAS-KARTE (Hauptinhalt)
     ========================================= */
  .glass-card {
    position: relative;
    z-index: 10;
    padding: 80px 100px;
    border-radius: 32px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    text-align: center;
    transform-style: preserve-3d;
    box-shadow: 
      0 30px 60px -20px rgba(0, 0, 0, 0.8),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
    transition: transform 0.1s ease-out; /* Smooth follow */
  }

  /* Sanfter Lichtreflex auf der Karte */
  .glass-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 32px;
    background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 40%, transparent 60%, rgba(255,255,255,0.02) 100%);
    pointer-events: none;
  }

  /* =========================================
     TYPOGRAFIE
     ========================================= */
  h1 {
    font-size: clamp(3.5rem, 8vw, 6.5rem);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.03em;
    margin-bottom: 24px;
    background: linear-gradient(135deg, #ffffff 20%, #94a3b8 80%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    transform: translateZ(50px); /* 3D Pop-Effekt */
  }

  p {
    font-size: clamp(1rem, 2vw, 1.2rem);
    color: var(--muted);
    font-weight: 300;
    letter-spacing: 0.05em;
    max-width: 400px;
    margin: 0 auto 48px;
    line-height: 1.6;
    transform: translateZ(30px);
  }

  /* =========================================
     BUTTON
     ========================================= */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 18px 40px;
    font-family: 'Outfit', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    color: #fff;
    text-decoration: none;
    border-radius: 100px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    position: relative;
    overflow: hidden;
    transform: translateZ(40px);
    transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    pointer-events: auto; /* Klickbar machen */
  }

  /* Der leuchtende Gradient im Hintergrund des Buttons */
  .btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, #38bdf8, #a855f7);
    opacity: 0;
    transition: opacity 0.4s ease;
    z-index: -1;
  }

  .btn:hover {
    transform: translateZ(40px) scale(1.05);
    border-color: transparent;
    box-shadow: 0 10px 40px -10px rgba(56, 189, 248, 0.5);
  }

  .btn:hover::before {
    opacity: 1;
  }

  /* =========================================
     CUSTOM CURSOR (Extrem Smooth)
     ========================================= */
  .cursor-dot {
    position: fixed;
    top: 0; left: 0;
    width: 6px; height: 6px;
    background: #fff;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 10px #fff;
  }

  .cursor-ring {
    position: fixed;
    top: 0; left: 0;
    width: 50px; height: 50px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: width 0.3s, height 0.3s, border-color 0.3s;
  }

  /* Cursor-Effekt beim Hover über den Button */
  .btn:hover ~ .cursor-ring,
  body:has(.btn:hover) .cursor-ring {
    width: 80px;
    height: 80px;
    border-color: rgba(168, 85, 247, 0.5);
    background: rgba(168, 85, 247, 0.05);
  }

  /* Mobile Anpassungen */
  @media (max-width: 768px) {
    .glass-card { padding: 50px 30px; margin: 20px; }
    * { cursor: auto; }
    .cursor-dot, .cursor-ring { display: none; }
    .glass-card { transform: none !important; }
  }
</style>
</head>
<body>

  <!-- 3D Sternenfeld -->
  <canvas id="starfield"></canvas>

  <!-- Hauptinhalt (Glas-Karte) -->
  <main class="glass-card" id="card">
    <h1>AETHER</h1>
    <p>Die Kunst der digitalen Stille. Ein Ort, an dem Design atmet und Technologie unsichtbar wird.</p>
    <a href="#" class="btn">Erkunden</a>
  </main>

  <!-- Custom Cursor -->
  <div class="cursor-dot" id="dot"></div>
  <div class="cursor-ring" id="ring"></div>

  <script>
    // ==========================================
    // 1. SMOOTH CUSTOM CURSOR (Lerp Effekt)
    // ==========================================
    const dot = document.getElementById('dot');
    const ring = document.getElementById('ring');
    
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    
    let dotX = mouseX, dotY = mouseY;
    let ringX = mouseX, ringY = mouseY;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    function animateCursor() {
      // Der Punkt folgt sehr schnell (Lerp 0.5)
      dotX += (mouseX - dotX) * 0.5;
      dotY += (mouseY - dotY) * 0.5;
      dot.style.transform = `translate(${dotX}px, ${dotY}px) translate(-50%, -50%)`;

      // Der Ring folgt träge und smooth (Lerp 0.1)
      ringX += (mouseX - ringX) * 0.1;
      ringY += (mouseY - ringY) * 0.1;
      ring.style.transform = `translate(${ringX}px, ${ringY}px) translate(-50%, -50%)`;

      requestAnimationFrame(animateCursor);
    }
    animateCursor();

    // ==========================================
    // 2. 3D TILT DER GLAS-KARTE (Extrem Smooth)
    // ==========================================
    const card = document.getElementById('card');
    let targetRotateX = 0;
    let targetRotateY = 0;
    let currentRotateX = 0;
    let currentRotateY = 0;

    window.addEventListener('mousemove', (e) => {
      // Berechnung des Winkels basierend auf der Mausposition
      const x = (window.innerWidth / 2 - e.clientX) / 40;
      const y = (window.innerHeight / 2 - e.clientY) / 40;
      
      targetRotateX = y;
      targetRotateY = x;
    });

    function animateCard() {
      // Lerp für butterweiche Bewegung
      currentRotateX += (targetRotateX - currentRotateX) * 0.05;
      currentRotateY += (targetRotateY - currentRotateY) * 0.05;

      card.style.transform = `rotateX(${currentRotateX}deg) rotateY(${currentRotateY}deg)`;

      requestAnimationFrame(animateCard);
    }
    animateCard();

    // ==========================================
    // 3. 3D STERNENFELD (WebGL / Canvas 2D)
    // ==========================================
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    
    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    window.addEventListener('resize', () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    });

    const stars = [];
    const numStars = 600;
    const speed = 0.5; // Geschwindigkeit des Flugs

    // Sterne initialisieren
    for (let i = 0; i < numStars; i++) {
      stars.push({
        x: (Math.random() - 0.5) * width * 2,
        y: (Math.random() - 0.5) * height * 2,
        z: Math.random() * width,
        color: Math.random() > 0.8 ? 'rgba(168, 85, 247, 0.8)' : 'rgba(255, 255, 255, 0.8)' // Ein paar lila Sterne
      });
    }

    function drawStars() {
      ctx.clearRect(0, 0, width, height);
      
      const cx = width / 2;
      const cy = height / 2;

      stars.forEach(star => {
        // Der Stern bewegt sich auf uns zu (z wird kleiner)
        star.z -= speed;

        // Wenn der Stern vorbei ist, setzen wir ihn wieder nach hinten
        if (star.z < 1) {
          star.z = width;
          star.x = (Math.random() - 0.5) * width * 2;
          star.y = (Math.random() - 0.5) * height * 2;
        }

        // 3D Projektion auf 2D
        const k = 128 / star.z; 
        const px = star.x * k + cx;
        const py = star.y * k + cy;
        const size = (1 - star.z / width) * 2.5; // Sterne werden größer, wenn sie näher kommen

        // Nur zeichnen, wenn der Stern auf dem Bildschirm ist
        if (px >= 0 && px <= width && py >= 0 && py <= height) {
          ctx.beginPath();
          ctx.arc(px, py, size, 0, Math.PI * 2);
          ctx.fillStyle = star.color;
          ctx.fill();
        }
      });

      requestAnimationFrame(drawStars);
    }
    drawStars();
  </script>
</body>
</html>
