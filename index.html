<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AETHER — Pure Elegance</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&display=swap');

  :root {
    --bg: #03060a;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --spotlight-x: 50%;
    --spotlight-y: 50%;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    cursor: none;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1500px;
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.05), transparent 40%),
      radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.05), transparent 40%);
    background-size: 200% 200%;
    animation: bgBreath 15s infinite alternate ease-in-out;
  }

  @keyframes bgBreath {
    0% { background-position: 0% 0%; }
    100% { background-position: 100% 100%; }
  }

  /* =========================================
     STERNENFELD (Canvas)
     ========================================= */
  #starfield {
    position: absolute;
    inset: 0;
    z-index: 0;
    /* Parallax wird per JS gesteuert */
    transition: transform 0.2s ease-out; 
  }

  /* =========================================
     GLAS-KARTE (Hauptinhalt)
     ========================================= */
  .glass-card {
    position: relative;
    z-index: 10;
    padding: 80px 100px;
    border-radius: 32px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    text-align: center;
    transform-style: preserve-3d;
    box-shadow: 
      0 30px 60px -20px rgba(0, 0, 0, 0.8),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
    
    /* Animation beim Laden */
    opacity: 0;
    transform: translateY(30px) rotateX(10deg);
    animation: cardAppear 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 0.2s;
  }

  @keyframes cardAppear {
    to {
      opacity: 1;
      transform: translateY(0) rotateX(0deg);
    }
  }

  /* Der Spotlight-Effekt auf der Karte */
  .glass-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 32px;
    background: radial-gradient(
      circle at var(--spotlight-x) var(--spotlight-y),
      rgba(255, 255, 255, 0.08) 0%,
      transparent 50%
    );
    pointer-events: none;
    z-index: -1;
    transition: background 0.1s ease;
  }

  /* =========================================
     TYPOGRAFIE (Mit Shimmer-Effekt)
     ========================================= */
  h1 {
    font-size: clamp(3.5rem, 8vw, 6.5rem);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.03em;
    margin-bottom: 24px;
    
    /* Shimmer Gradient */
    background: linear-gradient(
      120deg, 
      #ffffff 20%, 
      #94a3b8 40%, 
      #ffffff 60%, 
      #94a3b8 80%
    );
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 6s linear infinite;
    
    transform: translateZ(50px); /* 3D Pop */
  }

  @keyframes shine {
    to { background-position: 200% center; }
  }

  p {
    font-size: clamp(1rem, 2vw, 1.2rem);
    color: var(--muted);
    font-weight: 300;
    letter-spacing: 0.05em;
    max-width: 400px;
    margin: 0 auto 48px;
    line-height: 1.6;
    transform: translateZ(30px);
    
    opacity: 0;
    animation: fadeIn 1s ease forwards;
    animation-delay: 0.8s;
  }

  /* =========================================
     MAGNETISCHER BUTTON
     ========================================= */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 18px 40px;
    font-family: 'Outfit', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    color: #fff;
    text-decoration: none;
    border-radius: 100px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    position: relative;
    overflow: hidden;
    transform: translateZ(40px);
    
    /* Magnetisches Verhalten */
    transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease, border-color 0.3s ease;
    
    opacity: 0;
    animation: fadeIn 1s ease forwards;
    animation-delay: 1.2s;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  .btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, #38bdf8, #a855f7);
    opacity: 0;
    transition: opacity 0.4s ease;
    z-index: -1;
  }

  .btn:hover {
    border-color: transparent;
    box-shadow: 0 10px 40px -10px rgba(56, 189, 248, 0.6);
  }

  .btn:hover::before {
    opacity: 1;
  }

  /* =========================================
     CUSTOM CURSOR & FILMKORN
     ========================================= */
  .cursor-dot {
    position: fixed;
    top: 0; left: 0;
    width: 6px; height: 6px;
    background: #fff;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 10px #fff;
  }

  .cursor-ring {
    position: fixed;
    top: 0; left: 0;
    width: 50px; height: 50px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: width 0.3s, height 0.3s, border-color 0.3s;
  }

  .btn:hover ~ .cursor-ring,
  body:has(.btn:hover) .cursor-ring {
    width: 80px;
    height: 80px;
    border-color: rgba(168, 85, 247, 0.5);
    background: rgba(168, 85, 247, 0.05);
  }

  /* Filmkorn */
  .noise {
    position: fixed;
    inset: 0;
    z-index: 9997;
    pointer-events: none;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    animation: noiseShift 0.2s infinite;
  }

  @keyframes noiseShift {
    0% { transform: translate(0, 0); }
    25% { transform: translate(-1%, 1%); }
    50% { transform: translate(1%, -1%); }
    75% { transform: translate(-1%, -1%); }
    100% { transform: translate(1%, 1%); }
  }

  /* Mobile Anpassungen */
  @media (max-width: 768px) {
    .glass-card { padding: 50px 30px; margin: 20px; }
    * { cursor: auto; }
    .cursor-dot, .cursor-ring, .noise { display: none; }
    .glass-card { transform: none !important; }
  }
</style>
</head>
<body>

  <!-- 3D Sternenfeld -->
  <canvas id="starfield"></canvas>

  <!-- Hauptinhalt -->
  <main class="glass-card" id="card">
    <h1>AETHER</h1>
    <p>Die Kunst der digitalen Stille. Ein Ort, an dem Design atmet und Technologie unsichtbar wird.</p>
    <a href="#" class="btn" id="magnetic-btn">Erkunden</a>
  </main>

  <!-- Effekte -->
  <div class="noise"></div>
  <div class="cursor-dot" id="dot"></div>
  <div class="cursor-ring" id="ring"></div>

  <script>
    // ==========================================
    // 1. SMOOTH CUSTOM CURSOR
    // ==========================================
    const dot = document.getElementById('dot');
    const ring = document.getElementById('ring');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let dotX = mouseX, dotY = mouseY;
    let ringX = mouseX, ringY = mouseY;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    function animateCursor() {
      dotX += (mouseX - dotX) * 0.5;
      dotY += (mouseY - dotY) * 0.5;
      dot.style.transform = `translate(${dotX}px, ${dotY}px) translate(-50%, -50%)`;

      ringX += (mouseX - ringX) * 0.1;
      ringY += (mouseY - ringY) * 0.1;
      ring.style.transform = `translate(${ringX}px, ${ringY}px) translate(-50%, -50%)`;

      requestAnimationFrame(animateCursor);
    }
    animateCursor();

    // ==========================================
    // 2. 3D TILT & SPOTLIGHT EFFEKT
    // ==========================================
    const card = document.getElementById('card');
    let targetRotateX = 0;
    let targetRotateY = 0;
    let currentRotateX = 0;
    let currentRotateY = 0;

    window.addEventListener('mousemove', (e) => {
      // 3D Tilt berechnen
      const x = (window.innerWidth / 2 - e.clientX) / 40;
      const y = (window.innerHeight / 2 - e.clientY) / 40;
      targetRotateX = y;
      targetRotateY = x;

      // Spotlight-Position auf der Karte berechnen
      const rect = card.getBoundingClientRect();
      const cardX = e.clientX - rect.left;
      const cardY = e.clientY - rect.top;
      
      card.style.setProperty('--spotlight-x', `${cardX}px`);
      card.style.setProperty('--spotlight-y', `${cardY}px`);
    });

    function animateCard() {
      currentRotateX += (targetRotateX - currentRotateX) * 0.05;
      currentRotateY += (targetRotateY - currentRotateY) * 0.05;
      card.style.transform = `rotateX(${currentRotateX}deg) rotateY(${currentRotateY}deg)`;
      requestAnimationFrame(animateCard);
    }
    animateCard();

    // ==========================================
    // 3. MAGNETISCHER BUTTON
    // ==========================================
    const btn = document.getElementById('magnetic-btn');
    
    btn.addEventListener('mousemove', (e) => {
      const rect = btn.getBoundingClientRect();
      // Mittelpunkt des Buttons
      const btnCenterX = rect.left + rect.width / 2;
      const btnCenterY = rect.top + rect.height / 2;
      
      // Abstand der Maus zum Mittelpunkt
      const distanceX = e.clientX - btnCenterX;
      const distanceY = e.clientY - btnCenterY;
      
      // Den Button in Richtung der Maus ziehen (maximal 15px)
      btn.style.transform = `translateZ(40px) translate(${distanceX * 0.3}px, ${distanceY * 0.3}px) scale(1.05)`;
    });

    btn.addEventListener('mouseleave', () => {
      // Zurückschnappen lassen
      btn.style.transform = `translateZ(40px) translate(0px, 0px) scale(1)`;
    });

    // ==========================================
    // 4. PARALLAX STERNENFELD
    // ==========================================
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    const starfieldElement = document.getElementById('starfield');
    
    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    window.addEventListener('resize', () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    });

    const stars = [];
    const numStars = 600;
    const speed = 0.5;
    let parallaxX = 0;
    let parallaxY = 0;

    // Sterne init
    for (let i = 0; i < numStars; i++) {
      stars.push({
        x: (Math.random() - 0.5) * width * 2,
        y: (Math.random() - 0.5) * height * 2,
        z: Math.random() * width,
        color: Math.random() > 0.8 ? 'rgba(168, 85, 247, 0.8)' : 'rgba(255, 255, 255, 0.8)'
      });
    }

    // Mausbewegung für Parallax tracken
    window.addEventListener('mousemove', (e) => {
      // Berechne den Parallax-Offset (maximal 20px)
      parallaxX = (e.clientX / window.innerWidth - 0.5) * 20;
      parallaxY = (e.clientY / window.innerHeight - 0.5) * 20;
      
      // Das gesamte Canvas leicht verschieben
      starfieldElement.style.transform = `translate(${parallaxX * -1}px, ${parallaxY * -1}px)`;
    });

    function drawStars() {
      ctx.clearRect(0, 0, width, height);
      
      // Die Sterne verschieben sich im 3D-Raum leicht mit der Maus
      const cx = width / 2 - parallaxX * 2;
      const cy = height / 2 - parallaxY * 2;

      stars.forEach(star => {
        star.z -= speed;

        if (star.z < 1) {
          star.z = width;
          star.x = (Math.random() - 0.5) * width * 2;
          star.y = (Math.random() - 0.5) * height * 2;
        }

        const k = 128 / star.z; 
        const px = star.x * k + cx;
        const py = star.y * k + cy;
        const size = (1 - star.z / width) * 2.5;

        if (px >= 0 && px <= width && py >= 0 && py <= height) {
          ctx.beginPath();
          ctx.arc(px, py, size, 0, Math.PI * 2);
          ctx.fillStyle = star.color;
          ctx.fill();
        }
      });

      requestAnimationFrame(drawStars);
    }
    drawStars();
  </script>
</body>
</html>
