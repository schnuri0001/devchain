<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AETHER</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&display=swap');

  :root {
    --bg: #03060a;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --spot-x: 50%;
    --spot-y: 50%;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    cursor: none;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1500px;
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.05), transparent 40%),
      radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.05), transparent 40%);
    background-size: 200% 200%;
    animation: breathe 15s infinite alternate ease-in-out;
  }

  @keyframes breathe {
    0% { background-position: 0% 0%; }
    100% { background-position: 100% 100%; }
  }

  #stars {
    position: absolute;
    inset: 0;
    z-index: 0;
    transition: transform 0.2s ease-out;
  }

  .card {
    position: relative;
    z-index: 10;
    padding: 80px 100px;
    border-radius: 32px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    text-align: center;
    transform-style: preserve-3d;
    box-shadow: 
      0 30px 60px -20px rgba(0, 0, 0, 0.8),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
    opacity: 0;
    transform: translateY(30px) rotateX(10deg);
    animation: show 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 0.2s;
  }

  @keyframes show {
    to {
      opacity: 1;
      transform: translateY(0) rotateX(0deg);
    }
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 32px;
    background: radial-gradient(
      circle at var(--spot-x) var(--spot-y),
      rgba(255, 255, 255, 0.08) 0%,
      transparent 50%
    );
    pointer-events: none;
    z-index: -1;
  }

  h1 {
    font-size: clamp(3.5rem, 8vw, 6.5rem);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.03em;
    margin-bottom: 24px;
    background: linear-gradient(120deg, #ffffff 20%, #94a3b8 40%, #ffffff 60%, #94a3b8 80%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 6s linear infinite;
    transform: translateZ(50px);
  }

  @keyframes shine {
    to { background-position: 200% center; }
  }

  p {
    font-size: clamp(1rem, 2vw, 1.2rem);
    color: var(--muted);
    font-weight: 300;
    letter-spacing: 0.05em;
    max-width: 400px;
    margin: 0 auto 48px;
    line-height: 1.6;
    transform: translateZ(30px);
    opacity: 0;
    animation: fade 1s ease forwards;
    animation-delay: 0.8s;
  }

  @keyframes fade {
    to { opacity: 1; }
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 18px 40px;
    font-family: 'Outfit', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    color: #fff;
    text-decoration: none;
    border-radius: 100px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    position: relative;
    overflow: hidden;
    transform: translateZ(40px);
    transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease, border-color 0.3s ease;
    opacity: 0;
    animation: fade 1s ease forwards;
    animation-delay: 1.2s;
  }

  .btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, #38bdf8, #a855f7);
    opacity: 0;
    transition: opacity 0.4s ease;
    z-index: -1;
  }

  .btn:hover {
    border-color: transparent;
    box-shadow: 0 10px 40px -10px rgba(56, 189, 248, 0.6);
  }

  .btn:hover::before {
    opacity: 1;
  }

  .dot {
    position: fixed;
    top: 0; left: 0;
    width: 6px; height: 6px;
    background: #fff;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 10px #fff;
  }

  .ring {
    position: fixed;
    top: 0; left: 0;
    width: 50px; height: 50px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: width 0.3s, height 0.3s, border-color 0.3s;
  }

  body:has(.btn:hover) .ring {
    width: 80px;
    height: 80px;
    border-color: rgba(168, 85, 247, 0.5);
    background: rgba(168, 85, 247, 0.05);
  }

  .grain {
    position: fixed;
    inset: 0;
    z-index: 9997;
    pointer-events: none;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    animation: grain 0.2s infinite;
  }

  @keyframes grain {
    0% { transform: translate(0, 0); }
    25% { transform: translate(-1%, 1%); }
    50% { transform: translate(1%, -1%); }
    75% { transform: translate(-1%, -1%); }
    100% { transform: translate(1%, 1%); }
  }

  @media (max-width: 768px) {
    .card { padding: 50px 30px; margin: 20px; }
    * { cursor: auto; }
    .dot, .ring, .grain { display: none; }
    .card { transform: none !important; }
  }
</style>
</head>
<body>

  <canvas id="stars"></canvas>

  <main class="card" id="card">
    <h1>AETHER</h1>
    <p>Die Kunst der digitalen Stille. Ein Ort, an dem Design atmet und Technologie unsichtbar wird.</p>
    <a href="/explore" class="btn" id="magnet">Erkunden</a>
  </main>

  <div class="grain"></div>
  <div class="dot" id="dot"></div>
  <div class="ring" id="ring"></div>

  <script>
    const dot = document.getElementById('dot');
    const ring = document.getElementById('ring');
    let mx = window.innerWidth / 2;
    let my = window.innerHeight / 2;
    let dx = mx, dy = my;
    let rx = mx, ry = my;

    window.addEventListener('mousemove', e => {
      mx = e.clientX;
      my = e.clientY;
    });

    (function tick() {
      dx += (mx - dx) * 0.5;
      dy += (my - dy) * 0.5;
      dot.style.transform = `translate(${dx}px, ${dy}px) translate(-50%, -50%)`;

      rx += (mx - rx) * 0.1;
      ry += (my - ry) * 0.1;
      ring.style.transform = `translate(${rx}px, ${ry}px) translate(-50%, -50%)`;

      requestAnimationFrame(tick);
    })();

    const card = document.getElementById('card');
    let tx = 0, ty = 0, cx = 0, cy = 0;

    window.addEventListener('mousemove', e => {
      tx = (window.innerHeight / 2 - e.clientY) / 40;
      ty = (window.innerWidth / 2 - e.clientX) / 40;

      const r = card.getBoundingClientRect();
      card.style.setProperty('--spot-x', `${e.clientX - r.left}px`);
      card.style.setProperty('--spot-y', `${e.clientY - r.top}px`);
    });

    (function tilt() {
      cx += (tx - cx) * 0.05;
      cy += (ty - cy) * 0.05;
      card.style.transform = `rotateX(${cx}deg) rotateY(${cy}deg)`;
      requestAnimationFrame(tilt);
    })();

    const magnet = document.getElementById('magnet');

    magnet.addEventListener('mousemove', e => {
      const r = magnet.getBoundingClientRect();
      const ox = e.clientX - (r.left + r.width / 2);
      const oy = e.clientY - (r.top + r.height / 2);
      magnet.style.transform = `translateZ(40px) translate(${ox * 0.3}px, ${oy * 0.3}px) scale(1.05)`;
    });

    magnet.addEventListener('mouseleave', () => {
      magnet.style.transform = `translateZ(40px) translate(0, 0) scale(1)`;
    });

    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let w = window.innerWidth;
    let h = window.innerHeight;
    canvas.width = w;
    canvas.height = h;

    window.addEventListener('resize', () => {
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w;
      canvas.height = h;
    });

    const list = [];
    for (let i = 0; i < 600; i++) {
      list.push({
        x: (Math.random() - 0.5) * w * 2,
        y: (Math.random() - 0.5) * h * 2,
        z: Math.random() * w,
        c: Math.random() > 0.8 ? 'rgba(168, 85, 247, 0.8)' : 'rgba(255, 255, 255, 0.8)'
      });
    }

    let px = 0, py = 0;

    window.addEventListener('mousemove', e => {
      px = (e.clientX / window.innerWidth - 0.5) * 20;
      py = (e.clientY / window.innerHeight - 0.5) * 20;
      canvas.style.transform = `translate(${-px}px, ${-py}px)`;
    });

    (function loop() {
      ctx.clearRect(0, 0, w, h);
      const cx2 = w / 2 - px * 2;
      const cy2 = h / 2 - py * 2;

      for (const s of list) {
        s.z -= 0.5;
        if (s.z < 1) {
          s.z = w;
          s.x = (Math.random() - 0.5) * w * 2;
          s.y = (Math.random() - 0.5) * h * 2;
        }
        const k = 128 / s.z;
        const sx = s.x * k + cx2;
        const sy = s.y * k + cy2;
        const size = (1 - s.z / w) * 2.5;

        if (sx >= 0 && sx <= w && sy >= 0 && sy <= h) {
          ctx.beginPath();
          ctx.arc(sx, sy, size, 0, Math.PI * 2);
          ctx.fillStyle = s.c;
          ctx.fill();
        }
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
