<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Just Vibes</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap');

  :root {
    --bg: #050505;
    --text: #ffffff;
    --accent: #ff0055;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    cursor: none; /* Versteckt den Standard-Mauszeiger */
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    overflow: hidden; /* Verhindert Scrollen */
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* ---------- Hintergrund Blobs ---------- */
  .background {
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    filter: blur(80px);
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    animation: float 10s infinite alternate ease-in-out;
  }

  .blob-1 {
    width: 40vw;
    height: 40vw;
    background: #6c8cff;
    top: -10%;
    left: -10%;
  }

  .blob-2 {
    width: 35vw;
    height: 35vw;
    background: #b06cff;
    bottom: -10%;
    right: -10%;
    animation-delay: -5s;
    animation-duration: 12s;
  }

  .blob-3 {
    width: 25vw;
    height: 25vw;
    background: #ff6c9c;
    top: 40%;
    left: 40%;
    animation-duration: 8s;
    animation-delay: -2s;
  }

  @keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(10vw, 10vh) scale(1.2); }
  }

  /* ---------- Inhalt ---------- */
  .content {
    position: relative;
    z-index: 1;
    text-align: center;
    mix-blend-mode: exclusion; /* Geiler Effekt beim Überfahren der Blobs */
  }

  h1 {
    font-size: clamp(3rem, 12vw, 10rem);
    line-height: 0.9;
    text-transform: uppercase;
    letter-spacing: -0.05em;
    font-weight: 700;
    pointer-events: none; /* Text blockiert nicht die Maus */
  }

  p {
    font-size: clamp(1rem, 2vw, 1.5rem);
    margin-top: 20px;
    opacity: 0.7;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    pointer-events: none;
  }

  /* ---------- Custom Cursor ---------- */
  .cursor-dot,
  .cursor-ring {
    position: fixed;
    top: 0;
    left: 0;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
  }

  .cursor-dot {
    width: 8px;
    height: 8px;
    background-color: var(--text);
  }

  .cursor-ring {
    width: 40px;
    height: 40px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    transition: width 0.3s, height 0.3s, background-color 0.3s;
  }

  /* Hover-Effekt für den Cursor, wenn man über die Blobs fährt */
  body:hover .cursor-ring {
    width: 60px;
    height: 60px;
    border-color: var(--accent);
    background-color: rgba(255, 0, 85, 0.1);
  }

  /* Auf Mobilgeräten den Cursor wieder normal machen */
  @media (pointer: coarse) {
    * { cursor: auto; }
    .cursor-dot, .cursor-ring { display: none; }
  }
</style>
</head>
<body>

  <!-- Animierter Hintergrund -->
  <div class="background">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Inhalt -->
  <div class="content">
    <h1>Just<br>Vibes</h1>
    <p>Kein Zweck. Nur Code.</p>
  </div>

  <!-- Custom Cursor -->
  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>

  <script>
    // --- Custom Cursor Logik ---
    const dot = document.querySelector('.cursor-dot');
    const ring = document.querySelector('.cursor-ring');

    let mouseX = 0, mouseY = 0;
    let ringX = 0, ringY = 0;

    // Mausposition tracken
    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      
      // Der Punkt folgt der Maus sofort
      dot.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
    });

    // Der Ring folgt mit einer kleinen Verzögerung (Smooth Effect)
    function animateRing() {
      // Lerp (Lineare Interpolation) für den weichen Follow-Effekt
      ringX += (mouseX - ringX) * 0.15;
      ringY += (mouseY - ringY) * 0.15;
      
      ring.style.transform = `translate(${ringX}px, ${ringY}px) translate(-50%, -50%)`;
      
      requestAnimationFrame(animateRing);
    }
    animateRing();
  </script>
</body>
</html>
